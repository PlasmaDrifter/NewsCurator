<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="tuxBelly" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  <!-- Background badge for contrast in both light/dark tabs -->
  <rect width="64" height="64" rx="14" fill="#1e2230"/>
  <!-- Feet -->
  <ellipse cx="23" cy="53" rx="9" ry="4.5" fill="#f59e0b"/>
  <ellipse cx="41" cy="53" rx="9" ry="4.5" fill="#f59e0b"/>
  <!-- Flippers -->
  <ellipse cx="14" cy="37" rx="5" ry="11" transform="rotate(22 14 37)" fill="#0f172a"/>
  <ellipse cx="50" cy="37" rx="5" ry="11" transform="rotate(-22 50 37)" fill="#0f172a"/>
  <!-- Body & Head -->
  <ellipse cx="32" cy="37" rx="16" ry="16" fill="#0f172a"/>
  <ellipse cx="32" cy="21" rx="12.5" ry="11.5" fill="#0f172a"/>
  <!-- White Belly -->
  <ellipse cx="32" cy="39" rx="11" ry="13" fill="url(#tuxBelly)"/>
  <!-- Eyes -->
  <ellipse cx="27" cy="18" rx="3.5" ry="4.5" fill="#ffffff"/>
  <circle cx="28" cy="18" r="1.8" fill="#0f172a"/>
  <ellipse cx="37" cy="18" rx="3.5" ry="4.5" fill="#ffffff"/>
  <circle cx="36" cy="18" r="1.8" fill="#0f172a"/>
  <!-- Beak -->
  <path d="M26,23 Q32,20 38,23 Q32,29 26,23 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.75"/>
</svg>
